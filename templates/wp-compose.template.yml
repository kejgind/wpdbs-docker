# Template: copy to each WP site directory as compose.yml
# Replace SITE_NAME and SITE_DOMAIN with actual values
#
# Paths are relative to the site directory, so the file works the same under
# `sudo docker compose` (Omarchy default — sudo resets $HOME) and sudoless Docker.
# Shared files come from INFRA_DIR, default ../env-manage/local_infra
# (layout: ~/WebApps/<site>/ next to ~/WebApps/env-manage/local_infra/).
# Other layout: sudo INFRA_DIR=/path/to/_infra docker compose up -d
#
# Usage:
#   cp ~/WebApps/env-manage/local_infra/templates/wp-compose.template.yml ~/WebApps/SITE_DOMAIN/compose.yml
#   sed -i 's/SITE_NAME/my-site/g; s/SITE_DOMAIN/my-site.test/g' ~/WebApps/SITE_DOMAIN/compose.yml
#
# Per-site setup:
#   1. Edit wp-config.php: DB_HOST → 'mysql'
#   2. Add to wp-config.php before "stop editing" line:
#        if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
#            $_SERVER['HTTPS'] = 'on';
#        }
#   3. echo '127.0.0.1 SITE_DOMAIN' | sudo tee -a /etc/hosts
#
# File ownership: no chown. Apache/PHP and wp-cli run as UID/GID 1000 (your host user,
# check `id -u`), so site files stay yours and WordPress writes them directly.
# The image renumbers www-data to 1000; APACHE_RUN_USER=#1000 is NOT an alternative —
# without a passwd entry Apache can't drop privileges and PHP keeps running as root.
#
# Container DNS: no `dns:` here — Omarchy's /etc/docker/daemon.json defaults every
# container to 172.17.0.1 (systemd-resolved on docker0). extra_hosts maps the site's
# own domain to Traefik on the host, so WP loopback requests (wp-cron, Site Health) work.

services:
  wordpress:
    build:
      dockerfile_inline: |
        FROM wordpress:php8.4-apache
        RUN groupmod -o -g 1000 www-data && usermod -o -u 1000 -g 1000 www-data
    image: local/wordpress:php8.4-apache-uid1000
    container_name: wp-SITE_NAME
    restart: "no"
    extra_hosts:
      - "SITE_DOMAIN:host-gateway"
    environment:
      CURL_CA_BUNDLE: /usr/local/share/ca-certificates/mkcert-ca.crt
    volumes:
      - .:/var/www/html
      - ${INFRA_DIR:-../env-manage/local_infra}/traefik/certs/rootCA.pem:/usr/local/share/ca-certificates/mkcert-ca.crt:ro
      - ${INFRA_DIR:-../env-manage/local_infra}/config/php/wp-custom.ini:/usr/local/etc/php/conf.d/wp-custom.ini:ro
      - ${INFRA_DIR:-../env-manage/local_infra}/config/php/openssl-mkcert.ini:/usr/local/etc/php/conf.d/openssl-mkcert.ini:ro
      - ${INFRA_DIR:-../env-manage/local_infra}/config/wp/mu-plugins/mailpit-smtp.php:/var/www/html/wp-content/mu-plugins/mailpit-smtp.php:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.SITE_NAME.rule=Host(`SITE_DOMAIN`)"
      - "traefik.http.routers.SITE_NAME.entrypoints=websecure"
      - "traefik.http.routers.SITE_NAME.tls=true"
      - "traefik.http.services.SITE_NAME.loadbalancer.server.port=80"
    networks:
      - proxy
      - db

  wp-cli:
    image: wordpress:cli-php8.4
    container_name: wp-cli-SITE_NAME
    user: "1000:1000"
    extra_hosts:
      - "SITE_DOMAIN:host-gateway"
    environment:
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      CURL_CA_BUNDLE: /usr/local/share/ca-certificates/mkcert-ca.crt
    volumes:
      - .:/var/www/html
      - ${INFRA_DIR:-../env-manage/local_infra}/traefik/certs/rootCA.pem:/usr/local/share/ca-certificates/mkcert-ca.crt:ro
      - ${INFRA_DIR:-../env-manage/local_infra}/config/php/openssl-mkcert.ini:/usr/local/etc/php/conf.d/openssl-mkcert.ini:ro
      - ${INFRA_DIR:-../env-manage/local_infra}/config/wp/mu-plugins/mailpit-smtp.php:/var/www/html/wp-content/mu-plugins/mailpit-smtp.php:ro
    networks:
      - proxy
      - db
    profiles:
      - cli

networks:
  proxy:
    external: true
  db:
    external: true
